pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            name = 'MiuixSnapshots'
            url = uri('https://maven.pkg.github.com/compose-miuix-ui/miuix')
            def packageUser = providers.gradleProperty('gpr.user')
                .orElse(providers.environmentVariable('GITHUB_ACTOR'))
            def packageKey = providers.gradleProperty('gpr.key')
                .orElse(providers.environmentVariable('GITHUB_TOKEN'))
            if (packageUser.isPresent() && packageKey.isPresent()) {
                credentials {
                    username = packageUser.get()
                    password = packageKey.get()
                }
            }
            content {
                includeGroup 'top.yukonga.miuix.kmp'
            }
        }
    }
}

include ':app'
